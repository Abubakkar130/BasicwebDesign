<body>
    <!--removing list-->

        <ul id="taskList">
            <li>Task 1</li>
            <li>Task 2</li>
            <li>Task 3</li>
            <li>Task 4</li>
        </ul>
        <button id="removeList text">removeList text</button>
        </id>
</body>

        <!--js-->
        <script>
        document.getElementById("removeList text")
        .addEventListener("click",function(){
        const taskList= document.getElementById("taskList");
        const listTask=taskList.lastElementChild;//get the list <li>
            if(listTask){
                taskList.removeChild(listTask);
            }

        });
</script>
